version: 2
percy:
  useSystemProxy: false
  skipBaseBuild: false
snapshot:
  widths:
    - 375
    - 1280
  minHeight: 1024
  percyCSS: ""
  enableJavaScript: false
  cliEnableJavaScript: true
  disableShadowDOM: false
  forceShadowAsLightDOM: false
  responsiveSnapshotCapture: false
  ignoreCanvasSerializationErrors: false
  ignoreStyleSheetSerializationErrors: false
  ignoreIframeSelectors: []
  enablePseudoClassSerialization: false
  readiness:
    preset: strict # Waits for network quiet, visible images/fonts, and idle scripts (up to 30s)
    timeout-ms: 20000
discovery:
  allowedHostnames: ["assets.publishing.service.gov.uk", "*.openfreemap.org"]
  disallowedHostnames: []
  networkIdleTimeout: 750
  scrollToBottom: true
  captureMockedServiceWorker: false
  retry: true
  launchOptions:
    closeBrowser: true
  fontDomains: []
  autoConfigureAllowedHostnames: true
upload:
  files: "**/*.{png,jpg,jpeg}"
  ignore: ""
  stripExtensions: false
