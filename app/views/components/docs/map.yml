name: Map (experimental)
description: A simple map component.
body: |
  Displays a map, given a location and a zoom level. Maps can also display markers with popups. The map can be scrolled and zoomed.

  This component uses the [DEFRA map component](https://defra.github.io/interactive-map/).

  Maps are inaccessible to many users. If you are using this component to display information, you must also display this information in an accessible way separately from the map.

  The order of positional co-ordinates for this map and its contents is longitude followed by latitude. This is particularly important for markers.

  The JavaScript required for the component is relatively large and should not be included in the main `application.js`, instead the component includes its own required JavaScript files.
shared_accessibility_criteria:
- link

accessibility_criteria: |
  The map must:

  - have an accessible alternative, including a list of map markers separate to the map itself
  - be usable with a keyboard
  - provide a skip link to bypass the map for keyboard users
  - have a heading
uses_component_wrapper_helper: true
examples:
  default:
    data:
      heading_text: An example map
      zoom: 12
      centre:
      - -3.1883
      - 55.9533
  custom_heading_description_and_copyright:
    description: |
      All maps should have a heading, but the heading level will vary depending on the context. Heading size and subsequent headings within the component will be set based on the initial `heading_level` option.

      Descriptions are rendered inside a govspeak block, so can include govspeak formatting. Descriptions are not required but are recommended, to help users with screen readers understand the purpose of the map.
    data:
      heading_text: Malvern, Worcestershire
      heading_level: 3
      description: |
        <p>The Malvern Hills has been designated an area of outstanding natural beauty.</p>
      copyright: Contains OS data &copy; Crown copyright and database rights 2026
      centre:
      - -2.325062
      - 52.107919
      zoom: 12
  passed_geojson:
    description: |
      Given a URL to a GeoJSON file, the map will draw markers and apply popups as specified in the file.
    data:
      geojson: "/assets/frontend/components/map/map-test.geojson"
      heading_text: Birmingham and surrounding places
      zoom: 9
      centre:
      - -1.89032729180704
      - 52.485470314900795
  custom_bounds:
    description: This allows the initial position of the map to be set, overriding the automatic adjustment to show all markers.
    data:
      heading_text: Places with Ham in their name
      description: |
        <p>There's another one over in the east, look.</p>
      bounds:
      - -3.203169743770889
      - 51.643668495828116
      - -0.8983602517140259
      - 50.68105666989489
      geojson: data:application/geo+json;base64,
  max_bounds:
    description: Limits the map to a particular area. Numbers represent West, South, East, and North. Note that if the numbers are wrong or contradict it will have adverse effects on the map.
    data:
      heading_text: A map of only the area around London
      zoom: 9
      centre:
      - -0.12
      - 51.5
      max_bounds:
      - -1
      - 51.1
      - 1
      - 51.9
  custom_height:
    description: The map defaults to a height of 500px on desktop but this can be overridden if required. The height on tablet and mobile is set to be no taller than the window.
    data:
      height: 200
      heading_text: Paddington station
      markers:
      - geometry:
          type: Point
          coordinates:
          - -0.1766
          - 51.5163
        properties:
          name: Paddington Station
          description: Designed by Isambard Kingdom Brunel and opened in 1838.
  without_ga4_tracking:
    data:
      disable_ga4: true
      heading_text: London stations
      markers:
      - geometry:
          type: Point
          coordinates:
          - -0.1766
          - 51.5163
        properties:
          name: Paddington Station
          description: Designed by Isambard Kingdom Brunel and opened in 1838.
      - geometry:
          type: Point
          coordinates:
          - -0.1236
          - 51.5316
        properties:
          name: Kings Cross station
          description: Opened in 1852 and built on the site of a smallpox and fever hospital.
