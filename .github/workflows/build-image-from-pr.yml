name: Build image from PR

on:
  workflow_dispatch:
    inputs:
      gitRef:
        description: 'Commit, tag or branch name to build from'
        required: true
        type: string
  pull_request:

jobs:
  build-image-from-PR:
    name: Build image from PR
    uses: alphagov/govuk-infrastructure/.github/workflows/build-image-from-pr.yml@main
    with:
      gitRef: ${{ inputs.gitRef || github.head_ref }}
    permissions:
      id-token: write
      contents: read

  # Lets govuk-preview-app preview any branch of frontend itself, not just
  # releases - ImageResolver looks up ghcr.io/alphagov/govuk/frontend
  # tagged with a branch's own HEAD commit SHA, and waits for it to appear.
  # github.event.pull_request.head.sha is that same SHA (the PR branch's
  # real tip, not GitHub's synthetic merge commit). A separate job, left to
  # run alongside the build-check above rather than folded into it.
  #
  # (A dependency preview of frontend/draft-frontend is always built from
  # main regardless - this is about previewing frontend's own branch
  # standalone, which is the common case when someone opens a PR against it.)
  push-image:
    name: Push image from PR
    if: github.event_name == 'pull_request'
    needs: build-image-from-PR
    uses: alphagov/govuk-infrastructure/.github/workflows/build-push-arm-image.yml@main
    with:
      gitRef: ${{ github.event.pull_request.head.sha }}
    permissions:
      id-token: write
      contents: read
      packages: write
